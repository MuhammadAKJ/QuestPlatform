{% if economy.google_ads_enabled and economy.google_ads_client_id %}
<div class="ad-slot-container">
  <span class="ad-label">Advertisement</span>
  <!-- Google AdSense Unit -->
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="{{ economy.google_ads_client_id }}"
       data-ad-slot="{{ ad_slot_id|default('auto') }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>
       (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>
{% else %}
<!-- Strategic Monetization / Booster Slot Placeholder -->
<div class="ad-slot-container">
  <span class="ad-label">Sponsored / Featured</span>
  <div class="ad-placeholder-content">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <div style="width: 38px; height: 38px; border-radius: 8px; background: rgba(99,102,241,0.2); display: flex; align-items: center; justify-content: center; color: #818cf8; font-size: 1.2rem;">
        ⚡
      </div>
      <div style="text-align: left;">
        <div style="font-weight: 700; font-size: 0.95rem; color: #f8fafc;">Earn More with 2-Tier Referrals!</div>
        <div style="font-size: 0.8rem; color: #94a3b8;">Earn {{ economy.tier1_reward|currency }} on Tier-1 + {{ economy.tier2_reward|currency }} on Tier-2 recruits.</div>
      </div>
    </div>
    <a href="{{ url_for('main.referrals') if current_user.is_authenticated else url_for('auth.register') }}" class="btn btn-sm btn-outline-primary">
      Boost Earnings &rarr;
    </a>
  </div>
</div>
{% endif %}
